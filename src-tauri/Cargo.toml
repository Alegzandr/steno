[package]
name = "steno"
version = "0.1.0"
description = "Local-first voice dictation"
authors = ["Alexandre Farrenq"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "steno_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# GPU backends for whisper.cpp. Opt-in because each needs a toolchain the
# default build does not: `cuda` requires the CUDA toolkit and a `CUDA_PATH`,
# `vulkan` requires the Vulkan SDK. The CPU build needs neither and is what
# `cargo build` gives you.
cuda = ["whisper-rs/cuda", "llama-cpp-2/cuda"]
vulkan = ["whisper-rs/vulkan", "llama-cpp-2/vulkan"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
cpal = "0.18"
# `fft_resampler` is the only default feature and it pulls realfft/rustfft.
# The async sinc resampler used here does not need it.
rubato = { version = "4", default-features = false }
hound = "3.5"
thiserror = "2"
# Vendored, not from crates.io, for a three-line patch that adds the missing
# `set_carry_initial_prompt`. See "Vendored whisper-rs patch" in CLAUDE.md
# before touching this line. `vendor/whisper-rs` depends on `whisper-rs-sys`
# from crates.io exactly as the published crate does, so whisper.cpp itself is
# NOT vendored and is not rebuilt by this.
#
# No default features: they are all backend selectors, and the CPU backend is
# what whisper.cpp builds when none is named.
whisper-rs = { path = "vendor/whisper-rs", version = "0.16", default-features = false }
# The formatting model, in this process. whisper.cpp and llama.cpp each vendor
# their own copy of ggml, and MSVC resolves a duplicated symbol from whichever
# static library it reaches first — a link that succeeds and a runtime that is
# subtly wrong. `dynamic-link` + `dynamic-backends` is what avoids that: ggml
# becomes a set of DLLs loaded at run time (BUILD_SHARED_LIBS=ON,
# GGML_BACKEND_DL=ON), so there is nothing for the linker to pick between.
#
# The cost is that those DLLs must ship beside the executable and be found at
# run time — see `format::backends`, and the `resources` entry in
# tauri.conf.json. A missing one is not a load failure at startup, it is a
# failure at the first cleanup, which is why startup checks for them.
#
# No default features: `openmp` needs a runtime this build does not ship, and
# `common`/`android-*` are not used.
llama-cpp-2 = { version = "0.1.152", default-features = false, features = [
    "dynamic-link",
    "dynamic-backends",
] }
# `default-tls` is schannel on Windows: the OS trust store, no vendored crypto
# and no extra build tooling. `stream` is what makes a resumable download and a
# cancellable Ollama stream possible at all.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "default-tls",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.10"
# Two members out of NVIDIA's 391 MB cuBLAS archive, and nothing else: `by_name`
# seeks through the central directory rather than streaming the whole file, so
# `nvblas64_13.dll`, the headers and the import libraries are never inflated.
# Deflate is the only method the archive uses — read out of its central
# directory, not assumed — so every other codec the crate offers would be weight
# for nothing.
zip = { version = "8", default-features = false, features = ["deflate"] }
# Ctrl+Enter copies the buffer. The webview's own clipboard API needs document
# focus, which is the one thing this window deliberately never takes.
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# cpal declares `windows` and `windows-core` as two independent
# ">=0.61, <=0.62" ranges; Tauri pins `windows` to 0.61 but leaves
# `windows-core` free, so Cargo picks 0.62 for it and cpal's WASAPI backend
# fails to build against two incompatible copies of the same types. Naming
# `windows-core` here forces both onto 0.61.
windows-core = "0.61"
# DXGI for the video-memory probe that picks the default model, and the storage
# IOCTLs for `storage::media_type` — a model directory on a spinning disk costs
# a factor of fifty on first load and the user has no reason to suspect it.
# Held at 0.61 for the same reason as above.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
] }

[dev-dependencies]
# Spectrum analysis for the anti-aliasing test. Test-only, never bundled.
rustfft = "6"

# Resampling runs on the release path but also on every dev-build recording,
# where an unoptimised sinc filter is slow enough to notice. Optimise just this
# one crate in dev so debug builds resample at close to release speed without
# paying to optimise everything else.
[profile.dev.package.rubato]
opt-level = 3
