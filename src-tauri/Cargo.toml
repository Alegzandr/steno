[package]
name = "steno"
version = "0.1.0"
description = "Local-first voice dictation"
authors = ["Alexandre Farrenq"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "steno_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
cpal = "0.18"
# `fft_resampler` is the only default feature and it pulls realfft/rustfft.
# The async sinc resampler used here does not need it.
rubato = { version = "4", default-features = false }
hound = "3.5"
thiserror = "2"

[target.'cfg(target_os = "windows")'.dependencies]
# Not used directly. cpal declares `windows` and `windows-core` as two
# independent ">=0.61, <=0.62" ranges; Tauri pins `windows` to 0.61 but leaves
# `windows-core` free, so Cargo picks 0.62 for it and cpal's WASAPI backend
# fails to build against two incompatible copies of the same types. Naming it
# here forces both onto 0.61.
windows-core = "0.61"

[dev-dependencies]
# Spectrum analysis for the anti-aliasing test. Test-only, never bundled.
rustfft = "6"

# Resampling runs on the release path but also on every dev-build recording,
# where an unoptimised sinc filter is slow enough to notice. Optimise just this
# one crate in dev so debug builds resample at close to release speed without
# paying to optimise everything else.
[profile.dev.package.rubato]
opt-level = 3
